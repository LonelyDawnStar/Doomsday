// Attack triggers run once per actual basic attack, never from drones, splash or chained effects.
function prismArea(radius,mul){burst(p.x,p.y,'#d9baff',20);for(const e of [...enemies])if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<=radius+e.r)hit(e,p.damage*mul)}
function basicAugment(target){
 p.attackCount=(p.attackCount||0)+1;
 if(aug('attackheal'))p.hp=Math.min(p.max,p.hp+p.max*.04);
 if(aug('attackcdr'))p.nova=Math.max(0,p.nova-.8);
 if(aug('attackshield'))p.shield=Math.max(p.shield||0,Math.min(p.max*.6,(p.shield||0)+8));
 if(aug('extend')&&p.empower>0)p.empower=Math.min(12,p.empower+.6);
 if(aug('rage'))p.rage=Math.min(50,(p.rage||0)+1);
 if(aug('execute')&&target.hp/target.max<=.15)hit(target,target.hp);
 if(aug('echo')&&!target.dead)hit(target,p.damage);
 if(aug('fifth')&&p.attackCount%5===0&&!target.dead)hit(target,p.damage*7);
 if(aug('chain'))for(const e of enemies.filter(e=>!e.dead&&e!==target).slice(0,3)){hit(e,p.damage*.7);burst(e.x,e.y,'#d9baff',9)}
 if(aug('third')&&p.attackCount%3===0)prismArea(230,2.2);
}
function tickPrism(dt){
 if(aug('pulse')){p.pulseClock=(p.pulseClock??4)-dt;if(p.pulseClock<=0){p.pulseClock+=4;prismArea(260,2.5)}}
 if(aug('erase')){p.eraseClock=(p.eraseClock??6)-dt;if(p.eraseClock<=0){p.eraseClock+=6;bad=[];hazards=[];p.inv=Math.max(p.inv,1);burst(p.x,p.y,'#e0c3ff',30)}}
}

if(p){g.save();g.globalAlpha=p.inv>0?.65+Math.sin(time*40)*.25:1;drawActor(g,'doom',p.x,p.y+9,.9,time,swing>0||p.fire>p.rate-.1?'attack':(Math.abs(joy.x)+Math.abs(joy.y)>0||Object.values(keys).some(Boolean))?'walk':'idle',p.facing||1,tech);g.restore();g.fillStyle='#e4f8ca';g.textAlign='center';g.font='bold 10px system-ui';g.fillText('DOOM',p.x,p.y+36);g.strokeStyle='#d3f49b55';g.beginPath();g.arc(p.x,p.y,28,time,time+3);g.stroke()}
for(let a of particles){if(mode==='play'||mode==='upgrade'){a.t-=dt;if(!a.ring){a.x+=a.vx*dt;a.y+=a.vy*dt}}g.globalAlpha=Math.max(0,a.t/.6);g.fillStyle=a.color;if(a.ring){g.strokeStyle=a.color;g.lineWidth=4;g.beginPath();g.arc(a.x,a.y,(.6-a.t)*420,0,7);g.stroke()}else g.fillRect(a.x,a.y,3,3)}g.globalAlpha=1;particles=particles.filter(a=>a.t>0);g.restore()}

function reportGameError(error){console.error(error);mode='error';keys={};joy={x:0,y:0};panel('<h2>실행 오류로 잠시 멈췄습니다.</h2><p>아래 오류와 발생 상황을 캡처해 주세요. 보유 스킨은 유지됩니다.</p><pre id="crash-detail" style="white-space:pre-wrap;word-break:break-word"></pre><button onclick="showTitle()">타이틀로</button><button onclick="start()">다시 시작</button>');$('crash-detail').textContent=String(error&&error.stack||error).slice(0,1800)}
function loop(now){let dt=Math.min(.035,Math.max(0,(now-prev)/1000||.016));prev=now;try{if(mode!=='error'){if(mode==='play')update(dt);draw(dt);animateTitle(now);animateReveal(now)}}catch(error){reportGameError(error)}finally{requestAnimationFrame(loop)}}
addEventListener('error',event=>{if(mode!=='error')reportGameError(event.error||event.message)});
showTitle();requestAnimationFrame(loop);
</script></html>
