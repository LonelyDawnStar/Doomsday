function update(dt){time+=dt;p.inv-=dt;p.dash=Math.max(0,p.dash-dt);p.nova=Math.max(0,p.nova-dt);p.fire-=dt;advanceTech(dt);if(mode!=='play')return;lineTimer-=dt;if(lineTimer<0)$('line').textContent='';let x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x,y=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.y,n=Math.hypot(x,y);if(n>1){x/=n;y/=n}p.x=Math.max(20,Math.min(W-20,p.x+x*p.speed*dt));p.y=Math.max(Math.min(135,H*.4),Math.min(H-20,p.y+y*p.speed*dt));if(!boss){waveTime+=dt;spawn-=dt;let quota=16+stage*3;if(waveSpawned<quota&&spawn<=0&&enemies.filter(e=>!e.dead).length<10){enemy();waveSpawned++;spawn=1.35}if(waveKills>=quota&&waveTime>=24){if(wave<3){wave++;waveTime=0;waveKills=0;waveSpawned=0;spawn=1.8;say('WAVE '+wave+'/3 — 적 증원 접근');if(stage===0&&wave===2&&branch==='base'){openTech(1);return}}else summonBoss()}}let target=enemies.filter(e=>!e.dead).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(target&&p.fire<=0){p.facing=target.x<p.x?-1:1;fireAt(p.x,p.y,target,1);p.fire=p.rate;sound(430,.025)}
for(let e of enemies){if(e.dead)continue;e.age+=dt;e.attack=Math.max(0,(e.attack||0)-dt);e.flash=Math.max(0,(e.flash||0)-dt);let a=Math.atan2(p.y-e.y,p.x-e.x),dist=Math.hypot(p.x-e.x,p.y-e.y);if(dist>(e.boss?150:0)){let slow=fields.some(f=>f.slow&&Math.hypot(e.x-f.x,e.y-f.y)<f.r)?.38:1;e.x+=Math.cos(a)*e.speed*dt*slow;e.y+=Math.sin(a)*e.speed*dt*slow}if(dist<e.r+15)hurt(e.boss?20:10);if(!e.boss&&e.kind===1){e.shotClock-=dt;if(e.shotClock<=0){bullet(e,a,115);e.shotClock=3.4}}if(e.boss&&e.hp<e.max*.5&&e.phase===1){e.phase=2;e.speed*=1.3;say(profiles[e.actor].name+' · 2페이즈');hazards.push({x:p.x,y:p.y,r:65,t:1.2})}e.t-=dt;if(e.boss&&e.t<=0){e.attack=.5;e.t=stage===3?(e.actor==='carol'?2.6:e.actor==='monica'?3.1:3.5):(e.hp<e.max*.5?1.05:1.65);if(e.phase===2){e.t*=.8;for(let i=-1;i<=1;i++)bullet(e,a+i*.35,145)}if(stage===0){hazards.push({x:p.x,y:p.y,r:70,t:.85});e.charge={a,t:.65};say('쉬헐크: 강타와 돌진!')}
if(stage===1){burst(e.x,e.y,'#b08aef',20);e.x=45+Math.random()*(W-90);e.y=95+Math.random()*Math.max(1,H-150);for(let i=0;i<12;i++)bullet(e,i*Math.PI/6+e.age*.3,105);hazards.push({x:p.x,y:p.y,r:45,t:1.25})}
if(stage===2){for(let i=-1;i<=1;i++)bullet(e,a+i*.1,215);if(enemies.filter(v=>!v.boss&&!v.dead).length<5){for(let i=0;i<2;i++){enemy();let m=enemies[enemies.length-1];m.hp=m.max=48;m.speed=92}}}
if(stage===3){if(e.actor==='carol'){for(let i=-2;i<=2;i++)bullet(e,a+i*.14,180);burst(e.x,e.y,'#ffc878',10)}else if(e.actor==='monica'){for(let i=0;i<10;i++)bullet(e,i*Math.PI/5+e.age*.2,105);e.x=Math.max(35,Math.min(W-35,e.x+Math.cos(e.age)*70));e.y=Math.max(145,Math.min(H-35,e.y+Math.sin(e.age)*45));burst(e.x,e.y,'#8bdfff',18)}else{for(let i=0;i<2;i++)hazards.push({x:Math.max(40,Math.min(W-40,p.x+(i-.5)*95)),y:p.y,r:39,t:1.25+i*.15,color:'#d4a0ff',kind:'hardlight'});bullet(e,a,125)}}
if(stage===4){burst(e.x,e.y,'#ef89b0',15);e.x=Math.max(35,Math.min(W-35,e.x+(Math.random()-.5)*260));e.y=Math.max(90,Math.min(H-35,e.y+(Math.random()-.5)*170));a=Math.atan2(p.y-e.y,p.x-e.x);for(let i=-2;i<=2;i++)bullet(e,a+i*.15,210);for(let i=0;i<10;i++)bullet(e,i*Math.PI/5+e.age,95);hazards.push({x:p.x,y:p.y,r:55,t:1.15})}}
if(e.charge){e.charge.t-=dt;if(e.charge.t<.35){e.x=Math.max(30,Math.min(W-30,e.x+Math.cos(e.charge.a)*370*dt));e.y=Math.max(75,Math.min(H-30,e.y+Math.sin(e.charge.a)*370*dt))}if(e.charge.t<=0)e.charge=null}}

for(let s of shots){if(s.homing){let t=enemies.find(e=>!e.dead);if(t){let a=Math.atan2(t.y-s.y,t.x-s.x);s.vx+= (Math.cos(a)*390-s.vx)*dt*4;s.vy+=(Math.sin(a)*390-s.vy)*dt*4}}s.x+=s.vx*dt;s.y+=s.vy*dt;s.t-=dt;for(let e of enemies)if(!e.dead&&s.t>0&&!s.hit.has(e)&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+5){s.hit.add(e);hit(e,s.damage);if(s.blast){burst(s.x,s.y,'#c4a1ff',12);for(const o of enemies)if(o!==e&&!o.dead&&Math.hypot(o.x-e.x,o.y-e.y)<85)hit(o,s.damage*.5)}if(--s.pierce<=0){s.t=0;break}}}if(mode!=='play')return;for(let b of bad){let slow=fields.some(f=>f.slow&&Math.hypot(b.x-f.x,b.y-f.y)<f.r)?.3:1;b.x+=b.vx*dt*slow;b.y+=b.vy*dt*slow;b.t-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<19){hurt(13);b.t=0}}for(let h of hazards){h.t-=dt;if(h.t<=0){burst(h.x,h.y,'#ff795e',22);if(Math.hypot(h.x-p.x,h.y-p.y)<h.r+10)hurt(24)}}hazards=hazards.filter(h=>h.t>0);shots=shots.filter(s=>s.t>0);bad=bad.filter(b=>b.t>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);enemies=enemies.filter(e=>!e.dead);hud()}

function draw(dt){g.clearRect(0,0,W,H);let bg=g.createRadialGradient(W*.5,H*.4,20,W*.5,H*.5,Math.max(W,H)*.7);bg.addColorStop(0,'#293521');bg.addColorStop(.55,'#121e13');bg.addColorStop(1,'#050b08');g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
// Metallic arena borders and concentric targeting rings.
g.strokeStyle='#90a36c28';g.lineWidth=1;for(let i=0;i<5;i++){let inset=18+i*9;g.strokeRect(inset,120+inset*.2,W-inset*2,H-142-inset*.8)}for(let x=50;x<W;x+=130){g.fillStyle='#b8d68a05';g.fillRect(x,120,14,H-120);g.strokeStyle='#95ab6533';g.beginPath();g.moveTo(x,125);g.lineTo(x+35,H-25);g.stroke()}g.save();g.translate(W/2,H*.54);g.scale(1,.62);g.rotate(time*.015);g.strokeStyle='#adc47f30';for(let r of [100,175,245]){g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.stroke()}for(let i=0;i<16;i++){g.rotate(Math.PI/8);g.strokeRect(168,-8,14,16)}g.restore();
drawTech();for(let h of hazards){g.fillStyle=(h.color||'#ff805b')+'28';g.strokeStyle=h.color||'#ff9b6b';g.lineWidth=2;g.beginPath();if(h.kind==='hardlight'){g.moveTo(h.x,h.y-h.r);g.lineTo(h.x+h.r,h.y);g.lineTo(h.x,h.y+h.r);g.lineTo(h.x-h.r,h.y);g.closePath()}else g.arc(h.x,h.y,h.r,0,7);g.fill();g.stroke();g.beginPath();g.arc(h.x,h.y,h.r*Math.min(1,Math.max(.1,h.t)),0,7);g.stroke()}
for(let e of enemies){if(e.dead)continue;if(e.actor){g.save();g.globalAlpha=e.flash>0?.55:1;drawActor(g,e.actor,e.x,e.y+8,e.boss?1.03:.65,e.age,e.attack>0?'attack':'walk',p.x<e.x?-1:1);g.restore();g.textAlign='center';g.font='bold 12px system-ui';g.fillStyle='#eff4e8';g.strokeStyle='#071009';g.lineWidth=4;let label=profiles[e.actor].name;g.strokeText(label,e.x,e.y+e.r+19);g.fillText(label,e.x,e.y+e.r+19)}else{g.save();g.translate(e.x,e.y);g.rotate(e.age);g.strokeStyle=chapters[stage][2];g.fillStyle='#15251c';g.lineWidth=2;g.beginPath();g.moveTo(-13,0);g.lineTo(0,-8);g.lineTo(13,0);g.lineTo(7,9);g.lineTo(-7,9);g.closePath();g.fill();g.stroke();g.fillStyle=chapters[stage][2];g.fillRect(-4,-2,8,3);g.restore()}if(!e.boss){g.fillStyle='#8ebb7c';g.fillRect(e.x-15,e.y-e.r-10,30*Math.max(0,e.hp/e.max),3)}else if(e.charge){g.save();g.strokeStyle='#fcad6577';g.lineWidth=30;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.charge.a)*130,e.y+Math.sin(e.charge.a)*130);g.stroke();g.restore()}}
for(let s of shots){g.strokeStyle='#daff9b';g.lineWidth=tech==='heavy'?7:3;g.shadowColor='#a5e46a';g.shadowBlur=8;g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.x-s.vx*.02,s.y-s.vy*.02);g.stroke()}g.shadowBlur=0;for(let b of bad){g.fillStyle=b.color||'#eeb0e8';g.shadowColor=g.fillStyle;g.shadowBlur=9;g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()}g.shadowBlur=0;
if(p){g.save();g.globalAlpha=p.inv>0?.65+Math.sin(time*40)*.25:1;drawActor(g,'doom',p.x,p.y+9,.9,time,p.fire>p.rate-.1?'attack':(Math.abs(joy.x)+Math.abs(joy.y)>0||Object.values(keys).some(Boolean))?'walk':'idle',p.facing||1);g.restore();g.fillStyle='#e4f8ca';g.textAlign='center';g.font='bold 10px system-ui';g.fillText('DOOM',p.x,p.y+36);g.strokeStyle='#d3f49b55';g.beginPath();g.arc(p.x,p.y,28,time,time+3);g.stroke()}
for(let a of particles){if(mode==='play'||mode==='upgrade'){a.t-=dt;if(!a.ring){a.x+=a.vx*dt;a.y+=a.vy*dt}}g.globalAlpha=Math.max(0,a.t/.6);g.fillStyle=a.color;if(a.ring){g.strokeStyle=a.color;g.lineWidth=4;g.beginPath();g.arc(a.x,a.y,(.6-a.t)*420,0,7);g.stroke()}else g.fillRect(a.x,a.y,3,3)}g.globalAlpha=1;particles=particles.filter(a=>a.t>0);g.restore()}

function loop(now){let dt=Math.min(.035,(now-prev)/1000||.016);prev=now;if(mode==='play')update(dt);draw(dt);requestAnimationFrame(loop)}title();requestAnimationFrame(loop);
