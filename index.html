function sound(f=180,d=.06){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.45,audio.currentTime+d);v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}

function enemy(isBoss=false){let a=Math.random()*Math.PI*2;let e={x:Math.max(30,Math.min(W-30,W/2+Math.cos(a)*W*.48)),y:Math.max(90,Math.min(H-30,H/2+Math.sin(a)*H*.46)),r:isBoss?32:14,hp:isBoss?650+stage*190:34+stage*10,max:isBoss?650+stage*190:34+stage*10,boss:isBoss,t:1.4,age:0,speed:isBoss?40:58+stage*8};enemies.push(e);if(isBoss){boss=e;bad=[];say(chapters[stage][0]+' 등장 — '+bossTips[stage])}}
function hit(e,d){e.hp-=d;burst(e.x,e.y,chapters[stage][2],3);if(e.hp<=0&&!e.dead){e.dead=true;burst(e.x,e.y,chapters[stage][2],30);sound(100,.15);if(e.boss){mode='upgrade';bad=[];hazards=[];setTimeout(()=>{if(mode==='upgrade')upgrade()},350)}else{kills++;if(kills%5===0)p.hp=Math.min(p.max,p.hp+7)}}}
function hurt(d){if(p.inv>0)return;p.hp-=d;p.inv=.75;shake=9;sound(70,.13);if(p.hp<=0){mode='dead';panel('<div class="eyebrow">UNFINISHED STORY</div><h2>이번 타임라인은 여기까지.</h2><p>챕터 '+(stage+1)+'에서 갑옷이 정지했습니다. 회피의 무적 시간과 둠 파동의 탄막 제거를 활용하세요.</p><button class="primary" onclick="start()">다시 환생</button>')}}
function dash(){if(mode!=='play'||p.dash>0)return;let x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x,y=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.y,n=Math.hypot(x,y);if(!n){x=0;y=-1;n=1}burst(p.x,p.y,'#ceff8c',18);p.x=Math.max(20,Math.min(W-20,p.x+x/n*120));p.y=Math.max(70,Math.min(H-20,p.y+y/n*120));p.inv=.5;p.dash=2.5;sound(370)}

$('pause').onclick=pause;$('dash').onpointerdown=e=>{e.preventDefault();dash()};$('nova').onpointerdown=e=>{e.preventDefault();nova()};addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();keys[k]=true;if(!e.repeat){if(k===' ')dash();if(k==='e')nova();if(k==='p')pause()}});addEventListener('keyup',e=>keys[e.key.length===1?e.key.toLowerCase():e.key]=false);addEventListener('blur',()=>{keys={};joy={x:0,y:0};if(mode==='play')pause()});
let pad=$('pad'),pid=null;function move(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.hypot(x,y),lim=r.width*.32;if(n>lim){x*=lim/n;y*=lim/n}joy={x:x/lim,y:y/lim};$('stick').style.transform=`translate(${x}px,${y}px)`}pad.onpointerdown=e=>{pid=e.pointerId;pad.setPointerCapture(pid);move(e)};pad.onpointermove=e=>{if(e.pointerId===pid)move(e)};function release(){pid=null;joy={x:0,y:0};$('stick').style.transform='none'}pad.onpointerup=release;pad.onpointercancel=release;
function bullet(e,a,v=130){bad.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:6,t:9})}
function update(dt){time+=dt;p.inv-=dt;p.dash=Math.max(0,p.dash-dt);p.nova=Math.max(0,p.nova-dt);p.fire-=dt;lineTimer-=dt;if(lineTimer<0)$('line').textContent='';let x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x,y=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.y,n=Math.hypot(x,y);if(n>1){x/=n;y/=n}p.x=Math.max(20,Math.min(W-20,p.x+x*p.speed*dt));p.y=Math.max(75,Math.min(H-20,p.y+y*p.speed*dt));spawn-=dt;if(!boss&&kills<need&&spawn<=0&&enemies.filter(e=>!e.dead).length<9){enemy();spawn=.65}if(!boss&&kills>=need){enemies=[];enemy(true)}let target=enemies.filter(e=>!e.dead).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(target&&p.fire<=0){let a=Math.atan2(target.y-p.y,target.x-p.x);for(let i=0;i<p.multi;i++){let b=a+(i-(p.multi-1)/2)*.13;shots.push({x:p.x,y:p.y,vx:Math.cos(b)*560,vy:Math.sin(b)*560,t:1.7})}p.fire=p.rate;sound(430,.025)}
for(let e of enemies){if(e.dead)continue;e.age+=dt;let a=Math.atan2(p.y-e.y,p.x-e.x),dist=Math.hypot(p.x-e.x,p.y-e.y);if(dist>(e.boss?150:0)){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}if(dist<e.r+15)hurt(e.boss?20:10);e.t-=dt;if(e.boss&&e.t<=0){e.t=e.hp<e.max*.5?1.05:1.65;if(stage===0){hazards.push({x:p.x,y:p.y,r:70,t:.85});e.charge={a,t:.65};say('쉬헐크: 강타와 돌진!')}
if(stage===1){burst(e.x,e.y,'#b08aef',20);e.x=45+Math.random()*(W-90);e.y=95+Math.random()*Math.max(1,H-150);for(let i=0;i<12;i++)bullet(e,i*Math.PI/6+e.age*.3,105);hazards.push({x:p.x,y:p.y,r:45,t:1.25})}

if(stage===3){for(let i=-3;i<=3;i++)bullet(e,a+i*.13,190);for(let i=0;i<3;i++)hazards.push({x:Math.max(40,Math.min(W-40,p.x+(i-1)*90)),y:p.y,r:40,t:.9+i*.12})}

if(e.charge){e.charge.t-=dt;if(e.charge.t<.35){e.x=Math.max(30,Math.min(W-30,e.x+Math.cos(e.charge.a)*370*dt));e.y=Math.max(75,Math.min(H-30,e.y+Math.sin(e.charge.a)*370*dt))}if(e.charge.t<=0)e.charge=null}}

for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.t-=dt;for(let e of enemies)if(!e.dead&&s.t>0&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+5){hit(e,p.damage);s.t=0;break}}if(mode!=='play')return;for(let b of bad){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<19){hurt(13);b.t=0}}for(let h of hazards){h.t-=dt;if(h.t<=0){burst(h.x,h.y,'#ff795e',22);if(Math.hypot(h.x-p.x,h.y-p.y)<h.r+10)hurt(24)}}hazards=hazards.filter(h=>h.t>0);shots=shots.filter(s=>s.t>0);bad=bad.filter(b=>b.t>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);enemies=enemies.filter(e=>!e.dead);$('hp').style.width=Math.max(0,p.hp/p.max*100)+'%';$('level').textContent=level;$('stats').textContent=Math.ceil(Math.max(0,p.hp))+' / '+p.max+' · CH '+(stage+1)+'/5';$('bossname').textContent=boss?chapters[stage][0]:'균열 정리 '+kills+' / '+need;$('bosshp').style.width=boss?Math.max(0,boss.hp/boss.max*100)+'%':kills/need*100+'%';$('dash').textContent=p.dash>0?'회피 '+p.dash.toFixed(1):'회피';$('nova').textContent=p.nova>0?'파동 '+p.nova.toFixed(1):'둠 파동'}
function draw(dt){g.clearRect(0,0,W,H);g.fillStyle='#091210';g.fillRect(0,0,W,H);g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}g.strokeStyle='#203128';g.lineWidth=1;for(let x=0;x<W;x+=55){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=55){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.save();g.translate(W/2,H/2);g.rotate(time*.025);g.strokeStyle='#4a6e3b55';for(let r of [110,180,245]){g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.stroke()}for(let i=0;i<12;i++){g.rotate(Math.PI/6);g.strokeRect(170,-12,22,24)}g.restore();for(let h of hazards){g.fillStyle='#fa614d33';g.strokeStyle='#ff8b65';g.beginPath();g.arc(h.x,h.y,h.r,0,7);g.fill();g.stroke();g.beginPath();g.arc(h.x,h.y,h.r*Math.max(.1,h.t),0,7);g.stroke()}for(let e of enemies){g.save();g.translate(e.x,e.y);g.rotate(e.age*(e.boss?.45:1));g.shadowColor=chapters[stage][2];g.shadowBlur=e.boss?20:7;g.strokeStyle=chapters[stage][2];g.fillStyle='#17231f';g.lineWidth=3;g.beginPath();let count=e.boss?6:4;for(let i=0;i<count;i++){let a=i*Math.PI*2/count;g.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r)}g.closePath();g.fill();g.stroke();g.fillStyle=chapters[stage][2];g.fillRect(-6,-6,12,12);g.restore();g.textAlign='center';g.font='bold 13px system-ui';g.fillStyle='#eef6ed';g.fillText(e.boss?['쉬헐크','캉','닉 퓨리','캡틴 마블','아이언하트'][stage]:(stage===2?'스크럴':''),e.x,e.y+e.r+19);if(!e.boss){g.fillStyle='#8ebb7c';g.fillRect(e.x-15,e.y-24,30*e.hp/e.max,3)}}for(let s of shots){g.strokeStyle='#d7ff93';g.lineWidth=4;g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.x-s.vx*.018,s.y-s.vy*.018);g.stroke()}for(let b of bad){g.fillStyle='#eea0e5';g.beginPath();g.arc(b.x,b.y,6,0,7);g.fill()}
if(p){g.save();g.translate(p.x,p.y);g.globalAlpha=p.inv>0?.6+Math.sin(time*40)*.25:1;g.fillStyle='#164a30';g.beginPath();g.moveTo(-16,-16);g.lineTo(17,-16);g.lineTo(26,28);g.lineTo(0,20);g.lineTo(-26,28);g.closePath();g.fill();g.strokeStyle='#96be80';g.stroke();g.fillStyle='#9caea5';g.fillRect(-11,-10,22,25);g.fillStyle='#314a3b';g.fillRect(-18,-3,7,20);g.fillRect(11,-3,7,20);g.fillStyle='#1c3429';g.beginPath();g.arc(0,-14,15,Math.PI,Math.PI*2);g.lineTo(15,1);g.lineTo(-15,1);g.fill();g.fillStyle='#bcc9bd';g.beginPath();g.moveTo(-9,-21);g.lineTo(9,-21);g.lineTo(8,-5);g.lineTo(0,0);g.lineTo(-8,-5);g.closePath();g.fill();g.fillStyle='#10231b';g.fillRect(-7,-16,5,3);g.fillRect(2,-16,5,3);g.fillRect(-3,-8,6,2);g.shadowColor='#caff81';g.shadowBlur=18;g.fillStyle='#d5ffa0';g.beginPath();g.arc(0,6,4,0,7);g.fill();g.restore()}for(let a of particles){if(mode==='play'||mode==='upgrade'){a.t-=dt;if(!a.ring){a.x+=a.vx*dt;a.y+=a.vy*dt}}g.globalAlpha=Math.max(0,a.t/.6);g.fillStyle=a.color;if(a.ring){g.strokeStyle=a.color;g.lineWidth=5;g.beginPath();g.arc(a.x,a.y,(.6-a.t)*420,0,7);g.stroke()}else g.fillRect(a.x,a.y,4,4)}g.globalAlpha=1;particles=particles.filter(a=>a.t>0);g.restore()}
function loop(now){let dt=Math.min(.035,(now-prev)/1000||.016);prev=now;if(mode==='play')update(dt);draw(dt);requestAnimationFrame(loop)}title();requestAnimationFrame(loop);
